name: "axylauncher"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "games"
priority: "optional"
maintainer: "Xeone52670v3"
description: "Minecraft launcher in Rust with Material Design 3 UI"
homepage: "https://github.com/Xeone52670v3/AxyLauncher"
license: "GPL-3.0-only"
contents:
  - src: target/release/axylauncher
    dst: /usr/bin/axylauncher
    file_info:
      mode: 0755
  - src: packaging/axylauncher.desktop
    dst: /usr/share/applications/axylauncher.desktop
    file_info:
      mode: 0644
  - src: packaging/axylauncher.svg
    dst: /usr/share/icons/hicolor/scalable/apps/axylauncher.svg
    file_info:
      mode: 0644
