[package]
name = "axylauncher"
version = "0.2.1"
edition = "2021"
description = "AxyLauncher — Minecraft launcher in Rust inspired by FreesmLauncher with Material Design 3 UI"
license = "GPL-3.0-only"

[dependencies]
slint = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
open = "5"
env_logger = "0.11"

[build-dependencies]
slint-build = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
